name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests (a local server; no key, no request to mBenzin.cz)
        run: python -m pytest -q
      - name: Typing (mypy --strict)
        run: mypy
      - name: Lint and format
        run: ruff check . && ruff format --check .

  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: The wheel installs and imports, with its type marker
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import aiombenzin, importlib.resources as r; assert r.files('aiombenzin').joinpath('py.typed').is_file(); print(aiombenzin.__version__)"
