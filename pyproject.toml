[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiombenzin"
version = "0.1.0"
description = "Async client for the mBenzin.cz fuel price map (Czech Republic). Unofficial; needs your own access key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vituhlos" }]
keywords = ["mbenzin", "fuel", "prices", "czech", "asyncio", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10", "ruff>=0.6"]

[project.urls]
Source = "https://github.com/Vituhlos/aiombenzin"
Issues = "https://github.com/Vituhlos/aiombenzin/issues"
Changelog = "https://github.com/Vituhlos/aiombenzin/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aiombenzin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
